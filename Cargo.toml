[package]
name = "merman"
authors = ["Bruno Paz <bruno@brunopaz.dev>"]
edition = "2024"

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.10", package = "gtk4", features = ["v4_8"] }
tracing = "0.1.37"
tracing-subscriber = "0.3"
