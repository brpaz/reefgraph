[package]
name = "reefgraph"
authors = ["Bruno Paz <bruno@brunopaz.dev>"]
edition = "2024"
license = "MIT"

[profile.release]
lto = true

[dependencies]
cairo-rs = { version = "0.22", features = ["png", "svg", "v1_16"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_8"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
sourceview5 = "0.11"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
