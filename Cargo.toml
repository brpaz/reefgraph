[package]
name = "merman"
authors = ["Bruno Paz <bruno@brunopaz.dev>"]
edition = "2024"

[profile.release]
lto = true

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_5"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_14"] }
sourceview5 = "0.11"
tracing = "0.1.37"
tracing-subscriber = "0.3"
