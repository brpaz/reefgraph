name: Update draft release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: brpaz/draftsman@c8359ed96a2b991e763bd5f11cf2b5c1353e934c # v0.3.1
        with:
          command: draft
          backend: github
          token: ${{ secrets.GITHUB_TOKEN }}
