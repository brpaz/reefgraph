name: Update draft release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: brpaz/draftsman@v0.2.3
        with:
          command: draft
          backend: github
          token: ${{ secrets.GITHUB_TOKEN }}
