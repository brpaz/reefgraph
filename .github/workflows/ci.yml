name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # libadwaita >= 1.8 is not packaged on ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: dnf install -y git curl meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel gtksourceview5-devel blueprint-compiler glib2-devel gettext desktop-file-utils appstream

      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all -- -D warnings

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny

      - name: Check dependencies
        run: cargo deny check

  test:
    name: Test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      # desktop-file-utils and appstream are what let meson's registered
      # validate-desktop/validate-appdata tests actually run instead of
      # silently no-op'ing (see data/meson.build's `required: false` finds).
      - name: Install system dependencies
        run: dnf install -y git curl meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel gtksourceview5-devel blueprint-compiler glib2-devel gettext desktop-file-utils appstream

      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Build
        run: meson compile -C _build

      - name: Test
        run: meson test -C _build --print-errorlogs

  flatpak-dev:
    name: Build Flatpak (Development)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: [lint, test]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Prepare build
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          version="main-${short_sha}"
          echo -n "${version}" > VERSION

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: dev.brunopaz.Reefgraph.Devel.flatpak
          manifest-path: build-aux/dev.brunopaz.Reefgraph.Devel.json
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: dev.brunopaz.Reefgraph.Devel.flatpak
          path: dev.brunopaz.Reefgraph.Devel.flatpak

  flatpak-release:
    name: Build Flatpak (Release)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set version
        id: version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          echo -n "${version#v}" > VERSION
          echo "bundle=dev.brunopaz.Reefgraph-${version#v}-x86_64.flatpak" >> "$GITHUB_OUTPUT"
          python3 build-aux/add-release.py "${version}"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          bundle: ${{ steps.version.outputs.bundle }}
          manifest-path: build-aux/dev.brunopaz.Reefgraph.json
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Write checksum
        run: sha256sum "${{ steps.version.outputs.bundle }}" > "${{ steps.version.outputs.bundle }}.sha256"

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: ${{ steps.version.outputs.bundle }}

      - name: Upload Flatpak artifact to release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            ${{ steps.version.outputs.bundle }}
            ${{ steps.version.outputs.bundle }}.sha256
          token: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build .deb package
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    # libadwaita >= 1.8 is not packaged on ubuntu-latest
    container: debian:unstable
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates meson ninja-build gcc g++ pkg-config libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev blueprint-compiler libglib2.0-dev gettext desktop-file-utils appstream

      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0

      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo -n "${RELEASE_TAG#v}" > VERSION

      - uses: ./.github/actions/setup-nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .deb
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager deb --target .

      - name: Write checksum
        run: sha256sum *.deb > "$(echo *.deb).sha256"

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "*.deb"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reefgraph-deb
          path: |
            *.deb
            *.deb.sha256

  build-rpm:
    name: Build .rpm package
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel libadwaita-devel gtksourceview5-devel blueprint-compiler glib2-devel gettext desktop-file-utils appstream curl

      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.0

      - name: Set version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: echo -n "${RELEASE_TAG#v}" > VERSION

      - uses: ./.github/actions/setup-nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .rpm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager rpm --target .

      - name: Write checksum
        run: sha256sum *.rpm > "$(echo *.rpm).sha256"

      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: "*.rpm"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: reefgraph-rpm
          path: |
            *.rpm
            *.rpm.sha256

  native-packages-release:
    name: Attach .deb/.rpm packages to release
    needs: [build-deb, build-rpm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: reefgraph-deb

      - uses: actions/download-artifact@v8.0.2
        with:
          name: reefgraph-rpm

      - name: Upload packages to the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256
          token: ${{ secrets.GITHUB_TOKEN }}
