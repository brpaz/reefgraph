name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson gcc g++ libgtk-4-dev libglib2.0-dev libadwaita-1-dev libgtksourceview-5-dev blueprint-compiler

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

      - name: Run cargo clippy
        run: cargo clippy --all -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      # desktop-file-utils and appstream are what let meson's registered
      # validate-desktop/validate-appdata tests actually run instead of
      # silently no-op'ing (see data/meson.build's `required: false` finds).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc g++ pkg-config libgtk-4-dev libglib2.0-dev libadwaita-1-dev libgtksourceview-5-dev blueprint-compiler gettext desktop-file-utils appstream

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Build
        run: meson compile -C _build

      - name: Test
        run: meson test -C _build --print-errorlogs

  flatpak-dev:
    name: Build Flatpak (Development)
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    needs: [lint, test]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Prepare build
        shell: bash
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          version="main-${short_sha}"
          echo -n "${version}" > VERSION

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.brunopaz.Reefgraph.Devel.flatpak
          manifest-path: build-aux/dev.brunopaz.Reefgraph.Devel.json
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: dev.brunopaz.Reefgraph.Devel.flatpak
          path: dev.brunopaz.Reefgraph.Devel.flatpak

  flatpak-release:
    name: Build Flatpak (Release)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v6

      - name: Set version
        shell: bash
        run: |
          version="${{ github.event.release.tag_name }}"
          echo -n "${version}" > VERSION
          python3 build-aux/add-release.py "${version}"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: dev.brunopaz.Reefgraph.flatpak
          manifest-path: build-aux/dev.brunopaz.Reefgraph.json
          run-tests: false
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak artifact to release
        uses: softprops/action-gh-release@v3
        with:
          files: dev.brunopaz.Reefgraph.flatpak
          token: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build .deb package
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc g++ pkg-config libgtk-4-dev libglib2.0-dev libadwaita-1-dev libgtksourceview-5-dev blueprint-compiler gettext desktop-file-utils appstream

      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .deb
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager deb --target reefgraph.deb

      - uses: actions/upload-artifact@v7
        with:
          name: reefgraph-deb
          path: reefgraph.deb

  build-rpm:
    name: Build .rpm package
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          dnf install -y meson ninja-build gcc gcc-c++ pkgconf-pkg-config gtk4-devel glib2-devel libadwaita-devel gtksourceview5-devel blueprint-compiler gettext desktop-file-utils appstream curl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install nfpm
        run: curl -sSL https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin nfpm

      - name: Build and install into a staging root
        run: |
          meson setup _build --prefix=/usr
          meson compile -C _build
          DESTDIR="$PWD/_install" meson install -C _build

      - name: Package .rpm
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: VERSION="${RELEASE_TAG#v}" nfpm package --config nfpm.yaml --packager rpm --target reefgraph.rpm

      - uses: actions/upload-artifact@v7
        with:
          name: reefgraph-rpm
          path: reefgraph.rpm

  native-packages-release:
    name: Attach .deb/.rpm packages to release
    needs: [build-deb, build-rpm]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: reefgraph-deb

      - uses: actions/download-artifact@v8
        with:
          name: reefgraph-rpm

      - name: Upload packages to the release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            reefgraph.deb
            reefgraph.rpm
          token: ${{ secrets.GITHUB_TOKEN }}
