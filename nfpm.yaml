name: merman
arch: amd64
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Bruno Paz
vendor: Bruno Paz
homepage: https://github.com/brpaz/merman
license: MIT
description: |
  Visual WYSIWYG editor for Mermaid diagrams

# Built from a `DESTDIR=... meson install` staging root (see .github/workflows/ci.yml)
# — `type: tree` copies the whole installed layout (binary, desktop file, appdata,
# icons, gschema, D-Bus service, po/mo catalogs) without enumerating every file.
contents:
  - src: ./_install/usr/bin
    dst: /usr/bin
    type: tree

  - src: ./_install/usr/share
    dst: /usr/share
    type: tree

overrides:
  deb:
    depends:
      - libgtk-4-1
      - libglib2.0-0
  rpm:
    depends:
      - gtk4
      - glib2
